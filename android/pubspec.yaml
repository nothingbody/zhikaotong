name: zhikaotong
description: 职考通校园学生与教师端，学校题库练习、班级组卷与离线同步。
publish_to: 'none'
version: 0.8.5+16
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  crypto: ^3.0.7
  cupertino_icons: 1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-NotoSerifSC.txt
  fonts:
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC.ttf
